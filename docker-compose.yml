version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: ledgertrade-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ledgertrade-net

  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: ledgertrade-blockchain
    ports:
      - "8545:8545"
    networks:
      - ledgertrade-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ledgertrade-ml
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - ledgertrade-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledgertrade-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ledgertrade
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - mongodb
      - blockchain
      - ml-service
    networks:
      - ledgertrade-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledgertrade-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ledgertrade-net

volumes:
  mongo-data:

networks:
  ledgertrade-net:
    driver: bridge
